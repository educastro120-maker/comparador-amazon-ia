name: Etiquetar entradas existentes

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "prueba (no toca nada) o si (aplica)"
        default: "prueba"
      lote:
        description: "Cuántas entradas (un número, o todas). Cada una usa una consulta gratuita a la IA"
        default: "20"
      ids:
        description: "Opcional: IDs de entrada separados por coma"
        default: ""

permissions:
  contents: write

concurrency:
  group: robot-topcomparador
  cancel-in-progress: false

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ETIQUETAR_MODO: ${{ github.event.inputs.modo }}
      LOTE: ${{ github.event.inputs.lote }}
      IDS: ${{ github.event.inputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests google-genai
      - run: python etiquetar_entradas.py
