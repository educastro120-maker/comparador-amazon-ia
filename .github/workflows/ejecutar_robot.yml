name: Robot TopComparador

on:
  workflow_dispatch:
    inputs:
      max_nuevos:
        description: "Entradas nuevas a crear en esta ejecución"
        default: "5"
      estado_entradas:
        description: "draft (borrador) o publish (publicada)"
        default: "draft"
      categorias:
        description: "SOLO esta(s) categoría(s), separadas por coma (smartphone, smartwatch, tv...). Vacío = todas las activas, repartiendo más entradas a las que menos tienen"
        default: ""
      descubrir:
        description: "Descubrir productos nuevos con Tavily: prueba (no guarda nada), si, no"
        default: "si"
      enfoque:
        description: "Qué productos descubrir: mixto (los que haya a la venta), novedades (lanzados hace menos de 9 meses) o antiguos (más de 12 meses y aún a la venta)"
        default: "mixto"
      gama:
        description: "Opcional: buscar solo una gama de precio (economica, media o alta). Vacío = cualquiera"
        default: ""
      marcas:
        description: "Marcas a explorar por categoría en esta ejecución (vacío = las de siempre, 2). Para rellenar gamas, prueba 8"
        default: ""
      modelos:
        description: "Modelos de Gemini para redactar las fichas, separados por comas y en orden de preferencia"
        default: "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash"
      videos:
        description: "Añadir vídeos de YouTube a los borradores: si, prueba (solo muestra), no"
        default: "si"
      forzar_rankings:
        description: "Rankings a (re)generar como borrador: ids separados por coma, o 'todos'"
        default: ""
  schedule:
    - cron: "17 7 * * *"   # cada día (hora UTC)

permissions:
  contents: write

concurrency:
  group: robot-topcomparador
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      MAX_NUEVOS: ${{ github.event.inputs.max_nuevos || '5' }}
      ESTADO_ENTRADAS: ${{ github.event.inputs.estado_entradas || 'draft' }}
      SOLO_CATEGORIA: ${{ github.event.inputs.categorias || 'todas' }}
      DESCUBRIR_CATEGORIAS: ${{ github.event.inputs.categorias || '' }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # Ejecuciones automáticas (sin formulario): 'prueba' hasta que cambies esta palabra por 'si'
      DESCUBRIR_MARCAS: ${{ github.event.inputs.marcas }}
      GEMINI_MODELS: ${{ github.event.inputs.modelos || 'gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite' }}
      DESCUBRIR_GAMA: ${{ github.event.inputs.gama }}
      DESCUBRIR_ENFOQUE: ${{ github.event.inputs.enfoque || 'mixto' }}
      DESCUBRIR_MODO: ${{ github.event.inputs.descubrir || 'si' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      VIDEOS_MODO: ${{ github.event.inputs.videos || 'si' }}
      FORZAR_RANKINGS: ${{ github.event.inputs.forzar_rankings || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests google-genai

      - name: 1) Descubrir productos nuevos (Tavily + Gemini, gratis)
        if: ${{ (github.event.inputs.descubrir || 'si') != 'no' }}
        continue-on-error: true
        run: python descubrir_catalogo.py

      - name: 2) Publicar entradas (categoría y etiquetas automáticas)
        id: publicar
        continue-on-error: true
        run: python auto_publisher.py

      - name: 3) Añadir vídeos de YouTube a los borradores
        if: ${{ (github.event.inputs.videos || 'si') != 'no' }}
        continue-on-error: true
        run: python anadir_videos.py

      - name: 4) Generar páginas Top 10 en borrador
        continue-on-error: true
        run: python generar_rankings.py

      - name: 5) Páginas Top 10 por etiqueta (borrador; se publican al llegar a 10)
        continue-on-error: true
        run: python generar_paginas_etiqueta.py

      - name: Guardar la memoria (carpeta data/)
        if: always()
        run: |
          git config user.name "robot-topcomparador"
          git config user.email "robot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Robot: actualizar memoria (data/)"
          git pull --rebase || true
          git push || true

      - name: Marcar fallo si falló la publicación
        if: steps.publicar.outcome == 'failure'
        run: |
          echo "Hubo productos que fallaron; revisa data/fallos.json y el log del paso 2."
          exit 1
